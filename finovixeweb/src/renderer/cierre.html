<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:; img-src 'self' data:;">
  <title>Cierre de Caja | Inovix</title>
  <script src="./src/js/tailwindcss.js"></script>
  <script src="./src/js/sweetalert2.min.js"></script>
  <link rel="stylesheet" href="./css/sweetalert2.min.css">
  <script src="./src/js/jspdf.umd.min.js"></script>
  <script src="./src/js/jspdf.plugin.autotable.min.js"></script>
  <script src="./src/js/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="./css/estilos.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: linear-gradient(145deg, #f0f4ff 0%, #e0e7ff 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .glass-panel {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.6);
    }
    .metodo-card {
      background: white;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      border: 1px solid rgba(226,232,240,0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .metodo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 30px -10px rgba(0,31,63,0.12);
    }
    .metodo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }
    .icono-metodo {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .input-contado {
      transition: all 0.15s ease;
    }
    .input-contado:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    .btn-accion-tarjeta {
      font-size: 10px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-guardar {
      background: #eff6ff;
      color: #2563eb;
    }
    .btn-guardar:hover { background: #dbeafe; }
    .btn-editar {
      background: #fef3c7;
      color: #b45309;
    }
    .btn-editar:hover { background: #fde68a; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    input:disabled { background-color: #f8fafc; cursor: not-allowed; color: #94a3b8; }
  </style>
</head>
<body class="h-full flex flex-col p-5">
  <div class="flex flex-col gap-5 flex-1 h-full w-full relative min-h-0 max-w-7xl mx-auto">
    <div class="flex items-center justify-between gap-4 shrink-0">
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-2xl border border-slate-200 shadow-sm">
          <span class="text-base">📅</span>
          <label class="text-[11px] font-bold text-slate-700">Fecha:</label>
          <input type="date" id="cierre-fecha" onchange="cargarDatos()" class="h-7 px-2 text-[11px] bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-blue-600">
        </div>
        <span id="badge-cerrado" class="hidden bg-rose-100 text-rose-600 text-[10px] px-3 py-1 rounded-full border border-rose-200 uppercase tracking-widest font-bold">CERRADO</span>
      </div>
      <button onclick="abrirModalListaGastos()" class="h-9 px-4 bg-rose-50 text-rose-600 text-[11px] font-bold rounded-xl hover:bg-rose-100 transition-colors border border-rose-200 flex items-center gap-2 shadow-sm">
        👀 VER GASTOS
      </button>
    </div>
    <div class="flex-1 glass-panel flex flex-col overflow-hidden min-h-0 p-5">
      <div class="flex items-center gap-3 mb-4 shrink-0">
        <div class="w-9 h-9 bg-blue-100 rounded-xl flex items-center justify-center">
          <span class="text-blue-600 text-sm">⚖️</span>
        </div>
        <h3 class="font-bold text-zinc-800 text-sm">Arqueo por Método de Pago</h3>
        <p id="arqueo-instruccion" class="text-[10px] font-bold text-slate-500 ml-auto">Ingresa lo contado en cada método</p>
      </div>
      <div id="grid-metodos" class="flex-1 overflow-y-auto custom-scrollbar pr-1">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        </div>
      </div>
    </div>
    <div class="sticky bottom-0 bg-white border border-slate-200 rounded-2xl p-3 shadow-lg flex justify-end gap-2 items-center shrink-0">
      <p id="mensaje-estado" class="font-bold text-[11px] mr-auto text-slate-500">Verificando cuadre...</p>
      <button id="btn-limpiar" onclick="limpiarArqueo()" class="h-9 px-4 bg-white border border-slate-300 hover:bg-slate-100 text-slate-600 font-bold text-[11px] rounded-xl transition-all shadow-sm">LIMPIAR</button>
      <button id="btn-pdf-cierre" onclick="descargarCierrePDF()" class="hidden h-9 px-4 bg-zinc-800 hover:bg-zinc-900 text-white font-bold text-[11px] rounded-xl transition-all shadow-sm flex items-center gap-2">📄 PDF</button>
      <button id="btn-confirmar" onclick="confirmarCierre()" class="h-9 px-5 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold text-[11px] rounded-xl transition-all shadow-sm flex gap-1.5 items-center tracking-wide">
        CONFIRMAR CIERRE
      </button>
    </div>
  </div>
  <div id="modal-lista-gastos" class="fixed inset-0 bg-zinc-900/60 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-[650px] max-h-[70vh] flex flex-col border border-slate-200 overflow-hidden">
      <div class="flex justify-between items-center p-4 border-b bg-gradient-to-r from-rose-500 to-pink-500 shrink-0">
        <h3 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
          <span>📋</span> Gastos del Día
        </h3>
        <div class="flex gap-2">
          <button onclick="descargarGastosPDF()" class="bg-white/20 hover:bg-white/30 text-white text-[10px] font-bold px-2 py-1 rounded shadow-sm transition-all">📄 DESCARGAR</button>
          <button onclick="cerrarModalListaGastos()" class="text-white/70 hover:text-white hover:bg-white/10 w-7 h-7 flex items-center justify-center rounded-lg transition-all font-bold">✕</button>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-0 bg-slate-50 custom-scrollbar">
        <table class="w-full text-left border-collapse">
          <thead class="sticky top-0 bg-slate-100 border-b border-slate-200">
            <tr class="text-[10px] uppercase font-bold text-slate-500">
              <th class="py-2 px-4">Descripción</th>
              <th class="py-2 px-4">Método</th>
              <th class="py-2 px-4 text-right">Monto</th>
            </tr>
          </thead>
          <tbody id="tabla-lista-gastos" class="text-xs divide-y divide-slate-200 bg-white"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="./src/js/cierre.js"></script>
</body>
</html>
