<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:; img-src 'self' data:; frame-src 'self';">
  <title>Finovixe</title>
  <script src="./src/js/tailwindcss.js"></script>
  <script src="./src/js/sweetalert2.min.js"></script>
  <link rel="stylesheet" href="./css/sweetalert2.min.css">
  <script src="./src/js/jspdf.umd.min.js"></script>
  <script src="./src/js/jspdf.plugin.autotable.min.js"></script>
  <script src="./src/js/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="./css/estilos.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; font-size: 14.5px; }
    .main-content { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    #sidebar {
      width: 240px;
      min-width: 240px;
      transition: width 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), min-width 0.3s ease;
      background: linear-gradient(180deg, #0a0f1c 0%, #07101c 100%);
      border-right: 1px solid rgba(30, 58, 138, 0.3);
      box-shadow: 4px 0 20px rgba(0,0,0,0.3);
    }
    #sidebar.collapsed {
      width: 72px;
      min-width: 72px;
    }
    #sidebar.collapsed .sidebar-text,
    #sidebar.collapsed .sidebar-brand {
      display: none;
    }
    #sidebar.collapsed .nav-item {
      justify-content: center;
      padding: 12px 0 !important;
    }
    #sidebar.collapsed .nav-item span {
      margin: 0;
    }
    .nav-item {
      padding: 12px 16px !important;
      margin: 2px 8px;
      font-size: 13.5px;
      color: #94a3b8;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .nav-item:hover { background-color: rgba(30, 58, 138, 0.25); color: #e2e8f0; }
    .nav-item.active { background-color: rgba(30, 58, 138, 0.4); color: #ffffff; font-weight: 600; }
    #toggle-sidebar {
      transition: transform 0.3s ease;
      background: none;
      border: none;
      cursor: pointer;
      color: #64748b;
    }
    #toggle-sidebar:hover { color: #e2e8f0; }
    #sidebar.collapsed #toggle-sidebar {
      transform: rotate(180deg);
    }
    input, select, button { font-size: 14px; padding: 10px 14px; height: auto; border-radius: 12px; }
    input, select, textarea, button { -webkit-app-region: no-drag !important; pointer-events: auto !important; user-select: auto !important; }
    .nav-scrollbar::-webkit-scrollbar { width: 4px; }
    .nav-scrollbar::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 10px; }
  </style>
</head>
<body class="bg-[#EDF6FF] text-zinc-900 flex h-screen overflow-hidden">
  <div id="sidebar" class="flex flex-col shadow-2xl flex-shrink-0">
    <div class="p-5 border-b border-blue-900/20 flex items-center justify-between">
      <div class="flex items-center sidebar-brand">
        <div class="w-1.5 h-8 bg-blue-500 rounded-full shadow-[0_0_10px_rgba(59,130,246,0.6)] mr-3"></div>
        <span class="text-2xl font-black tracking-widest text-white">FINOVI<span class="text-[#3b82f6]">XE</span></span>
      </div>
      <button id="toggle-sidebar" onclick="toggleSidebar()" class="p-1 rounded-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
        </svg>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto nav-scrollbar px-3 py-2">
      <nav class="space-y-1 h-full flex flex-col justify-center">
        <a id="btn-nav-home" onclick="navegar('home')" class="nav-item active cursor-pointer">
          <span>🏠</span> <span class="sidebar-text">Inicio</span>
        </a>
        <a id="btn-nav-dashboard" onclick="navegar('dashboard')" class="nav-item cursor-pointer">
          <span>📊</span> <span class="sidebar-text">Panel Principal</span>
        </a>
        <a id="btn-nav-ventas" onclick="navegar('ventas')" class="nav-item cursor-pointer">
          <span>🛒</span> <span class="sidebar-text">Punto de Venta</span>
        </a>
        <a id="btn-nav-cierre" onclick="navegar('cierre')" class="nav-item cursor-pointer">
          <span>💰</span> <span class="sidebar-text">Cierre de Caja</span>
        </a>
        <a id="btn-nav-inventario" onclick="navegar('inventario')" class="nav-item cursor-pointer">
          <span>📦</span> <span class="sidebar-text">Inventario</span>
        </a>
        <a id="btn-nav-clientes" onclick="navegar('clientes')" class="nav-item cursor-pointer">
          <span>👥</span> <span class="sidebar-text">Clientes</span>
        </a>
        <a id="btn-nav-fiados" onclick="navegar('fiados')" class="nav-item cursor-pointer">
          <span>📌</span> <span class="sidebar-text">Créditos</span>
        </a>
        <a id="btn-nav-proveedores" onclick="navegar('proveedores')" class="nav-item cursor-pointer">
          <span>📈</span> <span class="sidebar-text">Proveedores</span>
        </a>
        <a id="btn-nav-reportes" onclick="navegar('reportes')" class="nav-item cursor-pointer">
          <span>📄</span> <span class="sidebar-text">Reportes</span>
        </a>
        <a id="btn-nav-configuracion" onclick="navegar('configuracion')" class="nav-item cursor-pointer">
          <span>⚙️</span> <span class="sidebar-text">Configuración</span>
        </a>
      </nav>
    </div>
  </div>
  <div class="flex-1 flex flex-col overflow-hidden">
    <div class="h-12 bg-[#07101c] border-b border-blue-900/30 flex justify-between items-center px-6 shadow-sm shrink-0 z-10">
      <div class="flex items-center gap-2 text-white font-semibold text-[13px] capitalize">
        <span class="text-blue-400 text-lg">🕒</span>
        <span id="global-clock">Cargando fecha y hora...</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-2 text-white text-[12px] font-bold">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
          Tasa Operativa: <span id="global-tasa" class="text-blue-300">---</span> Bs
        </span>
        <button onclick="cerrarSesion()" class="text-blue-400 hover:text-red-400 text-xs font-bold uppercase tracking-wider transition-colors flex items-center gap-1 ml-4 pl-4 border-l border-blue-900/30">
          <span>🚪</span> Salir
        </button>
      </div>
    </div>
    <div class="hidden">
      <h1 id="page-title">Inicio</h1>
    </div>
    <div id="main-content" class="flex-1 overflow-auto p-4 bg-[#EDF6FF] main-content">
      <div id="content-placeholder" class="h-full w-full"></div>
    </div>
  </div>
  <script src="./src/js/home.js"></script>
  <script>
    document.addEventListener('mousedown', () => {
      const iframe = document.querySelector('iframe');
      if (iframe) iframe.contentWindow.focus();
    });
  </script>
<script src="src/js/preload.js"></script>
</body>
</html>
