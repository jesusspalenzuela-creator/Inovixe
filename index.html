<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Una Chica Especial ✨</title>
    
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- ESTILOS GLOBALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fondo degradado más profundo y rico, azul intenso */
            background: linear-gradient(135deg, #020024 0%, #090979 35%, #00d4ff 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 500px;
            perspective: 1000px;
        }

        /* --- EFECTO GLASSMORPHISM --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transition: opacity 0.8s ease, transform 0.8s ease;
            position: absolute;
            width: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .glass-card h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: #FF1493; 
            text-shadow: 0 0 15px rgba(255, 20, 147, 0.7);
        }

        .glass-card p {
            font-size: 1.1rem;
            margin-bottom: 35px;
            color: #f0f0f0;
            font-weight: 300;
        }

        button {
            background: linear-gradient(45deg, #FF1493 0%, #00d4ff 100%);
            border: none;
            border-radius: 30px;
            padding: 15px 45px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 20, 147, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.8);
        }

        /* --- PANTALLAS Y ANIMACIONES --- */
        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -40%) scale(0.9);
        }

        .active {
            opacity: 1;
            pointer-events: all;
            transform: translate(-50%, -50%) scale(1);
        }

        #message-screen {
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #title-msg {
            font-family: 'Pacifico', cursive;
            font-size: 2.5rem;
            color: #FF1493;
            margin-bottom: 25px;
            opacity: 0;
            transition: opacity 1s ease;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
        }

        #typed-text {
            font-size: 1.2rem;
            line-height: 1.8;
            min-height: 150px;
            text-align: left;
            font-weight: 400;
            color: #fff;
        }

        #final-row {
            font-size: 2.5rem;
            margin-top: 25px;
            opacity: 0;
            transition: opacity 1s ease;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        #final-heart {
            color: #FF0000;
        }

        #final-star {
            color: #FFD700;
        }

        .fade-in {
            opacity: 1 !important;
        }

        /* --- RESPONSIVE DESIGN (MÓVILES) --- */
        @media (max-width: 480px) {
            .glass-card {
                padding: 30px 20px;
            }
            .glass-card h1 {
                font-size: 2.2rem;
            }
            .glass-card p {
                font-size: 1rem;
                margin-bottom: 25px;
            }
            button {
                padding: 12px 30px;
                font-size: 1.1rem;
            }
            #message-screen {
                min-height: 420px; /* Un poco más de espacio para el texto en varias líneas */
            }
            #title-msg {
                font-size: 2rem;
                margin-bottom: 15px;
            }
            #typed-text {
                font-size: 1.05rem;
                line-height: 1.6;
                min-height: 180px;
            }
            #final-row {
                font-size: 2rem;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Canvas para las partículas mágicas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Contenedor Principal -->
    <div class="container">
        <!-- Pantalla de inicio -->
        <div id="start-screen" class="glass-card active">
            <h1>Hola...</h1>
            <p>Tengo un mensaje pequeñito para ti hoy ✨</p>
            <button id="start-btn">Ver mensaje</button>
        </div>

        <!-- Pantalla del mensaje -->
        <div id="message-screen" class="glass-card hidden">
            <div class="message-content">
                <h2 id="title-msg">Feliz Día del Niño</h2>
                <p id="typed-text"></p>
                <!-- Fila con el corazón rojo y la estrellita final -->
                <div id="final-row">
                    <span id="final-heart">❤️</span>
                    <span id="final-star">✨</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CÓDIGO JAVASCRIPT ---
        
        // 1. LÓGICA DEL LIENZO (PARTÍCULAS)
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const colors = ['#FF1493', '#00FFFF', '#FFD700', '#FFFFFF'];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 0.5;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.speedY = Math.random() * 0.8 - 0.4;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 7000; 
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        // 2. LÓGICA DE INTERACCIÓN Y TEXTO
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const messageScreen = document.getElementById('message-screen');
        const typedTextElement = document.getElementById('typed-text');
        const titleMsg = document.getElementById('title-msg');
        const finalRow = document.getElementById('final-row');

        const mensaje = "Aunque ya crecimos, hoy es un buen día para recordar que siempre hay que cuidar nuestra sonrisa...\n\nY quería decirte que la tuya es mi favorita.\n\nMe gustas mucho y, para mí, tú siempre serás mi niña favorita.";

        let charIndex = 0;

        function typeWriter() {
            if (charIndex < mensaje.length) {
                if (mensaje.charAt(charIndex) === '\n') {
                    typedTextElement.innerHTML += '<br>';
                } else {
                    typedTextElement.innerHTML += mensaje.charAt(charIndex);
                }
                charIndex++;
                setTimeout(typeWriter, 60);
            } else {
                // Mostrar el corazón y la estrella poco después de terminar
                setTimeout(() => {
                    finalRow.classList.add('fade-in');
                }, 800);
            }
        }

        startBtn.addEventListener('click', () => {
            particlesArray.forEach(p => {
                p.speedX *= 6;
                p.speedY *= 6;
                p.size *= 1.5;
            });

            startScreen.classList.remove('active');
            startScreen.classList.add('hidden');
            
            setTimeout(() => {
                particlesArray.forEach(p => {
                    p.speedX /= 5;
                    p.speedY /= 5;
                    p.size /= 1.5;
                });

                messageScreen.classList.remove('hidden');
                messageScreen.classList.add('active');
                
                setTimeout(() => {
                    titleMsg.classList.add('fade-in');
                    
                    setTimeout(typeWriter, 1000);
                }, 500);
            }, 800);
        });
    </script>
</body>
</html>
